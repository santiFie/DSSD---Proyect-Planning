<div class="pedido-list">
  <h2>Pedidos del Cloud</h2>

  <div *ngIf="loading">Cargando pedidos...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && pedidos?.length" class="pedido-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>ID de proyecto</th>
        <th>ID etapa</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pedidos">
        <td>{{ p.id }}</td>
        <td>{{ p.proyectoId || '-' }}</td>
        <td>{{ p.etapaId || '-' }}</td>
        <td>{{ p.descripcion || '-' }}</td>
        <td>{{ p.estado || '-' }}</td>
        <td>
          <div (click)="brindarAyuda(p)" class="btn btn-secondary">Brindar ayuda</div>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && (!pedidos || pedidos.length === 0)">No hay pedidos.</div>
</div>
