<div class="user-list-container">
  <div class="header">
    <h1>👥 Gestión de Usuarios</h1>
    <button class="btn-primary" (click)="toggleCreateForm()">
      {{ showCreateForm ? '❌ Cancelar' : '➕ Nuevo Usuario' }}
    </button>
  </div>

  <div class="alert alert-success" *ngIf="successMessage">
    ✅ {{ successMessage }}
  </div>

  <div class="alert alert-error" *ngIf="errorMessage && !showCreateForm">
    ⚠️ {{ errorMessage }}
  </div>

  <div class="create-form-card" *ngIf="showCreateForm">
    <h2>Crear Nuevo Usuario</h2>
    
    <form (ngSubmit)="createUser()">
      <div class="form-row">
        <div class="form-group">
          <label for="username">Nombre de Usuario *</label>
          <input
            type="text"
            id="username"
            [(ngModel)]="newUser.username"
            name="username"
            placeholder="Ingrese el nombre de usuario"
            required
            [disabled]="loading"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="newUser.password"
            name="password"
            placeholder="Ingrese la contraseña"
            required
            [disabled]="loading"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="role">Rol *</label>
          <select
            id="role"
            [(ngModel)]="newUser.role"
            name="role"
            required
            [disabled]="loading"
          >
            <option value="USER">Usuario</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ongId">ONG *</label>
          <select
            id="ongId"
            [(ngModel)]="newUser.ongId"
            name="ongId"
            required
            [disabled]="loading"
          >
            <option *ngFor="let ong of ongs" [value]="ong.id">
              {{ ong.name }} - {{ ong.originCountry }}
            </option>
          </select>
        </div>
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="toggleCreateForm()" [disabled]="loading">
          Cancelar
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading || !newUser.username || !newUser.password">
          {{ loading ? 'Creando...' : 'Crear Usuario' }}
        </button>
      </div>
    </form>
  </div>

  <div class="users-table">
    <table *ngIf="users.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Rol</th>
          <th>ONG</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>
            <span class="badge" [class.admin]="user.role === 'ADMIN'">
              {{ user.role }}
            </span>
          </td>
          <td>{{ user.ongName }}</td>
        </tr>
      </tbody>
    </table>

    <div class="empty-state" *ngIf="users.length === 0">
      <p>No hay usuarios registrados</p>
    </div>
  </div>
</div>
