<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Sistema de Planificación</h1>
      <h2>Iniciar Sesión</h2>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="credentials.username"
          name="username"
          placeholder="Ingrese su usuario"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="credentials.password"
          name="password"
          placeholder="Ingrese su contraseña"
          required
          [disabled]="loading"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading || !credentials.username || !credentials.password">
        <span *ngIf="!loading">Ingresar</span>
        <span *ngIf="loading">Cargando...</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Credenciales por defecto:</p>
      <small><strong>Admin:</strong> admin / admin123</small><br>
      <small><strong>Usuario:</strong> ongeneral / user123</small><br>
      <small><strong>Usuario:</strong> ongmaterial / user123</small><br>
      <small><strong>Usuario:</strong> ongmanoobra / user123</small><br>
      <small><strong>Usuario:</strong> ongdinero / user123</small><br>
      <small><strong>Directivo:</strong> directivo / directivo123</small>
    </div>
  </div>
</div>
